<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración — Mi App Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">Panel de Administración</span>
            <button id="btnLogout" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </div>
    </nav>

    <main class="container my-5">

        <div id="avisoNoAutenticado" class="alert alert-warning" hidden>
            No has iniciado sesión. <a href="login.html">Ir al login</a>
        </div>

        <div id="contenidoAdmin" hidden>
            <h1 class="h4 mb-4">Contactos recibidos</h1>

            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Mensaje</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaContactos">
                        <!-- Las filas se insertan dinámicamente con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal de edición (Bootstrap) -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar contacto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditar">
                        <input type="hidden" id="editarId">

                        <div class="mb-3">
                            <label for="editarNombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="editarNombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="editarCorreo" class="form-label">Correo</label>
                            <input type="text" class="form-control" id="editarCorreo" required>
                        </div>

                        <div class="mb-3">
                            <label for="editarMensaje" class="form-label">Mensaje</label>
                            <textarea class="form-control" id="editarMensaje" rows="3" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnGuardarEdicion" class="btn btn-primary">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
